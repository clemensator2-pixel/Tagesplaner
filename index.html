<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tagesplaner</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1d2230;--m:#6b7385;--l:#e3e6ec;--a:#3b6df0;--ok:#2e9e5b;--no:#d6453d;--w:#e69a1f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1b202b;--t:#e8ebf2;--m:#98a0b3;--l:#2b3242;--a:#6b92ff;--ok:#44c27b;--no:#ef6a62;--w:#f0b04a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
h2{font-size:17px;margin:0 0 8px}
button,input,select{font:inherit;color:inherit}
.chip{border:1px solid var(--l);background:var(--c);border-radius:20px;padding:6px 13px;white-space:nowrap;cursor:pointer}
.on{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}
main{max-width:900px;margin:auto;padding:0 16px 80px}
#top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:900px;margin:auto}
#top h1{flex:1;margin:0;font-size:19px}
#mb{border:1px solid var(--l);background:var(--c);border-radius:10px;font-size:22px;width:44px;height:40px;cursor:pointer}
#dr{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:80vw;background:var(--c);border-right:1px solid var(--l);z-index:40;transform:translateX(-105%);transition:.2s;padding:16px 10px;overflow:auto}
#dr.o{transform:none}#ov{position:fixed;inset:0;background:#0006;z-index:30;display:none}#ov.o{display:block}
.mi{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px;border-radius:10px;cursor:pointer;text-align:left}
#sb{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--c);border-top:1px solid var(--l);padding:6px 16px 8px;font-size:13px;cursor:pointer;color:var(--m)}#sb b{color:var(--t)}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.m{color:var(--m);font-size:14px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
input,select{border:1px solid var(--l);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
.btn{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.x{background:none;border:0;color:var(--m);cursor:pointer;font-size:18px}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--l)}.it>div{flex:1}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}.ck input{width:20px;height:20px}
.sc{max-height:68vh;overflow:auto;padding-right:2px}
.b{display:flex;gap:12px;border-left:5px solid var(--c2);background:color-mix(in srgb,var(--c2) 13%,var(--c));border-radius:10px;padding:8px 12px;margin-bottom:6px}
.b .tm{min-width:46px;font-variant-numeric:tabular-nums}.now{outline:2px solid var(--a)}
.over{color:var(--no)}.done{opacity:.5;text-decoration:line-through}.past{opacity:.5}
table{border-collapse:collapse;width:100%}td,th{padding:4px;text-align:center;font-size:14px}td:first-child{text-align:left}
.hm{width:28px;height:28px;border-radius:6px;display:inline-block;line-height:28px;cursor:pointer}
.bar{height:10px;border-radius:5px;background:var(--l);overflow:hidden}.bar i{display:block;height:100%}
.cols{display:flex;gap:8px;align-items:flex-end;height:90px}.cols div{flex:1;text-align:center;font-size:12px;color:var(--m)}.cols i{display:block;border-radius:4px 4px 0 0;background:var(--a);margin-bottom:3px}
.big{font-size:34px;font-weight:700}
</style></head><body>

19:30","Badminton-Training","sport"],["19:30","23:00","frei","free"]],[["07:00","07:30","Schlafen","sleep"],["07:30","08:00","Aufstehen & fertig machen","pack"],["08:00","09:30","Zeitungen verteilen","job"],["09:30","23:00","frei","free"]],[["07:00","10:00","frei","free"],["10:00","10:30","Lernen","study"],["10:30","22:25","frei","free"],["22:25","22:30","Geräte laden","dev"],["22:30","23:00","Schlafen","sleep"]]]};
const $=s=>document.querySelector(s),K='tagesplaner-v1',D=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const COL={pack:'#8d96a8',school:'#3b6df0',travel:'#8d96a8',meal:'#e69a1f',hw:'#8a5cf0',study:'#8a5cf0',ther:'#e0589b',sport:'#2e9e5b',dev:'#14a3b8',sleep:'#4b5563',free:'#b8bfcc',job:'#c2410c'},ICO={pack:'🎒',school:'🏫',travel:'🚶',meal:'🍽️',hw:'📚',study:'📖',ther:'🧠',sport:'🏸',dev:'🔌',sleep:'😴',free:'🕊️',job:'📰'};
const GR="1,1-,2+,2,2-,3+,3,3-,4+,4,4-,5+,5,5-,6".split(","),gv=g=>+g[0]+(g[1]=='-'?.33:g[1]=='+'?-.33:0);
const TABS=[['heute','Heute','🏠'],['plan','Tagesplan','📅'],['hw','Hausaufgaben','📚'],['tt','Stundenplan','🕒'],['ar','Arbeiten','📝'],['gr','Noten','🎓'],['sum','Wochen-Summary','📊'],['set','Einstellungen','⚙️']];
let S={hw:[],ar:[],gr:[],tt:{A:{},B:{}},subj:"Deutsch,Mathe,Englisch,Spanisch,Chemie,Physik,Biologie,Geschichte,Erdkunde,Politik,Sport,Musik,Kunst,Religion,Informatik".split(","),
crit:[{id:'hw',n:'Alle Hausaufgaben erledigt',d:[0,1,2,3,4]},{id:'lern',n:'30 Min. gelernt',d:[0,1,2,3,4,6]},{id:'los',n:'Um 8:00 losgelaufen (Zeitungen)',d:[5]},{id:'gera',n:'Geräte geladen (22:25)',d:[0,1,2,3,6]},{id:'schl',n:'Pünktlich schlafen gegangen (22:30)',d:[0,1,2,3,6]}],ck:{},anc:'2026-10-12',ancT:'A'};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const W1=[["Biologie","Biologie","Spanisch","Spanisch","Politik","Politik"],["Mathe","Mathe","Englisch","Englisch","Spanisch","Spanisch"],["Mathe","Mathe","Englisch","Deutsch","Religion","WWW"],["Deutsch","Deutsch","Chemie","Chemie","WWW","WWW"],["Kunst","Kunst","Sport","Sport","Religion","Geschichte"]],
mkTT=b=>{const o={};W1.forEach((d,c)=>d.forEach((s,i)=>o[(i+1)+'-'+c]=s));if(b){o['8-2']='Geschichte';o['9-2']='Geschichte'}return o},
TM="8:00,8:45,9:50,10:40,11:40,12:30,13:30,14:20,15:05".split(","),
SC={Biologie:'#2f5d3a',Mathe:'#4a4ad0',Deutsch:'#e8453c',Englisch:'#f0842c',Spanisch:'#9a8fd6',Chemie:'#8a2a8a',Politik:'#5a9a3a',Religion:'#e8d82a',WWW:'#808080',Geschichte:'#2ab5c8',Kunst:'#e040e0',Sport:'#9a8fd6'},
sc=s=>SC[s]?`color-mix(in srgb,${SC[s]} 28%,var(--c))`:'var(--bg)';
if(S.v!=4){['A','B'].forEach(w=>{if(!Object.keys(S.tt[w]||{}).length)S.tt[w]=mkTT(w=='B')});if(S.subj.join()=="Deutsch,Mathe,Englisch,Spanisch,Chemie,Physik,Biologie,Geschichte,Erdkunde,Politik,Sport,Musik,Kunst,Religion,Informatik")S.subj="Biologie,Mathe,Deutsch,Englisch,Spanisch,Chemie,Politik,Religion,WWW,Geschichte,Kunst,Sport".split(",");const l=S.crit.find(c=>c.id=='lern');if(l)l.d=[0,1,2,3,4,6];S.crit.forEach(c=>{if(c.id=='gera'||c.id=='schl')c.d=[0,1,2,3,6]});if(!S.crit.some(c=>c.id=='los'))S.crit.splice(2,0,{id:'los',n:'Um 8:00 losgelaufen (Zeitungen)',d:[5]});S.v=4;save()}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,0)+'-'+String(d.getDate()).padStart(2,0),pd=s=>new Date(s+'T12:00:00'),
add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)},di=s=>(pd(s).getDay()+6)%7,mon=s=>add(s,-di(s)),T=()=>iso(new Date()),
wt=s=>{const w=Math.round((pd(mon(s))-pd(S.anc))/6048e5);return (w%2+2)%2?(S.ancT=='A'?'B':'A'):S.ancT},
fm=s=>pd(s).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
mn=t=>{const[a,b]=t.split(':');return a*60+ +b},nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()},
dur=m=>m<60?m+' Min.':Math.floor(m/60)+' Std.'+(m%60?' '+m%60+' Min.':''),
nf=x=>x.toFixed(2).replace('.',','),opts=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${esc(x)}</option>`).join('');
let tab='heute',selDay=di(T()),planT=null,sumOff=0,hwF='open',ttT=null;
const V={};
const mo=()=>{$('#dr').classList.toggle('o');$('#ov').classList.toggle('o')};
function R(){const c=TABS.find(x=>x[0]==tab);$('#ti').textContent=c[2]+' '+c[1];
$('#dr').innerHTML='<h2 style="padding:0 12px 8px">📋 Tagesplaner</h2>'+TABS.map(([k,n,i])=>`<button class="mi ${k==tab?'on':''}" onclick="tab='${k}';R();scrollTo(0,0)"><span style="font-size:20px">${i}</span>${n}</button>`).join('');
$('#dr').classList.remove('o');$('#ov').classList.remove('o');$('#v').innerHTML=V[tab]();
const t=T(),cs=S.crit.filter(c=>c.d.includes(di(t))),dn=cs.filter(c=>(S.ck[t]||{})[c.id]).length,o=S.hw.filter(h=>!h.x).length;
$('#sb').innerHTML=`✅ Heute <b>${dn}/${cs.length}</b> erledigt · 📚 <b>${o}</b> Hausaufgabe${o==1?'':'n'} übrig<div class="bar" style="margin-top:4px;height:5px"><i style="width:${cs.length?dn/cs.length*100:0}%;background:var(--ok)"></i></div>`;
const e=$('.now');if(tab=='plan'&&e)e.scrollIntoView({block:'center'})}
const tg=(d,id,v)=>{(S.ck[d]=S.ck[d]||{})[id]=v;save();R()},del=(k,i)=>{S[k]=S[k].filter(o=>o.i!=i);save();R()};
const chk=d=>S.crit.filter(c=>c.d.includes(di(d))).map(c=>`<label class="ck"><input type="checkbox" ${(S.ck[d]||{})[c.id]?'checked':''} onchange="tg('${d}','${c.id}',this.checked)">${esc(c.n)}</label>`).join('')||'<p class="m">Heute keine Kriterien.</p>';
const wk=m=>{const t=T();let dn=0,tt=0;const g=S.crit.map(c=>({c,v:[0,1,2,3,4,5,6].map(i=>{const d=add(m,i);if(!c.d.includes(i)||d>t)return null;const v=!!(S.ck[d]||{})[c.id];tt++;dn+=v;return v})}));return{g,p:tt?Math.round(dn/tt*100):0}};
const pc=p=>p>=80?'var(--ok)':p>=50?'var(--w)':'var(--no)';
V.heute=()=>{const t=T(),d=di(t),w=wt(t),b=PLAN[w][d],n=nowM(),cur=b.find(x=>n>=mn(x[0])&&n<mn(x[1])),nx=b.find(x=>mn(x[0])>n&&x[3]!='free'),
open=S.hw.filter(h=>!h.x),od=open.filter(h=>h.d<t).length,ar=S.ar.filter(a=>a.d>=t).sort((a,b)=>a.d<b.d?-1:1)[0],p=wk(mon(t)).p;
return `<div class="card"><h2>${D[d]}, ${fm(t)} · Woche ${w}</h2><p class="m">${cur?'Jetzt: <b>'+esc(cur[2])+'</b> (bis '+cur[1]+')':'Gerade nichts geplant.'}${nx?'<br>Als Nächstes: '+esc(nx[2])+' um '+nx[0]:''}</p></div>
<div class="card"><h2>Heute abhaken</h2>${chk(t)}</div>
<div class="card"><h2>Überblick</h2><p>Offene Hausaufgaben: <b>${open.length}</b>${od?` <span class="over">(${od} überfällig)</span>`:''}</p>
<p>${ar?'Nächste Arbeit: <b>'+esc(ar.s)+'</b> '+rel(ar.d):'Keine Arbeit eingetragen.'}</p><p>Wochenerfolg bisher: <b style="color:${pc(p)}">${p} %</b></p></div>`};
V.plan=()=>{const cur=wt(T()),t=planT||cur,date=add(mon(T()),selDay),td=date==T()&&t==cur,n=nowM();
return `<div class="row">${['A','B'].map(x=>`<button class="chip ${x==t?'on':''}" onclick="planT='${x}';R()">Woche ${x}${x==cur?' (aktuell)':''}</button>`).join('')}</div>
<div class="row">${D.map((x,i)=>`<button class="chip ${i==selDay?'on':''}" onclick="selDay=${i};R()">${x.slice(0,2)}</button>`).join('')}</div>
<div class="sc">${PLAN[t][selDay].map(([s,e,nm,c])=>{const m=mn(e)-mn(s),on=td&&n>=mn(s)&&n<mn(e);return `<div class="b ${on?'now':''}" style="min-height:${Math.max(48,m*.55)}px;--c2:${COL[c]}"><div class="tm">${s}<br><small class="m">${e}</small></div><div><b>${ICO[c]} ${esc(nm)}</b><div class="m">${dur(m)}</div></div></div>`}).join('')}</div>`};
const rel=d=>{const n=Math.round((pd(d)-pd(T()))/864e5);return n==0?'<b>heute</b>':n==1?'morgen':n>0?'in '+n+' Tagen':'vor '+-n+' Tagen'};
V.hw=()=>{const t=T(),l=S.hw.filter(h=>hwF=='all'||(hwF=='open')!=h.x).sort((a,b)=>a.d<b.d?-1:1);
return `<div class="card"><div class="row"><select id="hs">${opts(S.subj)}</select><input id="ht" placeholder="Aufgabe" style="flex:1"><input id="hd" type="date" value="${add(t,1)}"><button class="btn" onclick="if($('#ht').value.trim()){S.hw.push({i:Date.now(),s:$('#hs').value,t:$('#ht').value.trim(),d:$('#hd').value,x:false});save();R()}">+</button></div>
<div class="row">${[['open','Offen'],['done','Erledigt'],['all','Alle']].map(([k,n])=>`<button class="chip ${k==hwF?'on':''}" onclick="hwF='${k}';R()">${n}</button>`).join('')}</div>
${l.map(h=>`<div class="it"><input type="checkbox" ${h.x?'checked':''} onchange="S.hw.find(o=>o.i==${h.i}).x=this.checked;save();R()"><div class="${h.x?'done':''}"><b>${esc(h.s)}</b>: ${esc(h.t)}<div class="m ${!h.x&&h.d<t?'over':''}">fällig ${fm(h.d)}</div></div><button class="x" onclick="del('hw',${h.i})">×</button></div>`).join('')||'<p class="m">Nichts hier.</p>'}</div>`};
V.tt=()=>{const t=ttT||wt(T());
return `<div class="card"><div class="row">${['A','B'].map(x=>`<button class="chip ${x==t?'on':''}" onclick="ttT='${x}';R()">Woche ${x}</button>`).join('')}</div><p class="m">Dein Stundenplan ist eingetragen. Du kannst jedes Fach ändern (wird automatisch gespeichert).</p>
<datalist id="sj">${S.subj.map(s=>`<option>${esc(s)}</option>`).join('')}</datalist>
<table><tr><th></th>${D.slice(0,5).map(x=>`<th>${x.slice(0,2)}</th>`).join('')}</tr>${[1,2,3,4,5,6,7,8,9].map(r=>`<tr><td>${r}.<br><small class="m">${TM[r-1]}</small></td>${[0,1,2,3,4].map(c=>`<td><input list="sj" style="width:100%;padding:6px 1px;text-align:center;font-size:12px;background:${sc(S.tt[t][r+'-'+c])}" value="${esc(S.tt[t][r+'-'+c]||'')}" onchange="S.tt['${t}']['${r}-${c}']=this.value;save();R()"></td>`).join('')}</tr>`).join('')}</table></div>`};
V.ar=()=>{const t=T();
return `<div class="card"><div class="row"><select id="as">${opts(S.subj)}</select><input id="ad" type="date" value="${add(t,7)}"><input id="at" placeholder="Thema" style="flex:1"><button class="btn" onclick="S.ar.push({i:Date.now(),s:$('#as').value,d:$('#ad').value,t:$('#at').value.trim()});save();R()">+</button></div>
${S.ar.slice().sort((a,b)=>a.d<b.d?-1:1).map(a=>`<div class="it ${a.d<t?'past':''}"><div><b>${esc(a.s)}</b> ${esc(a.t)}<div class="m">${fm(a.d)} · ${rel(a.d)}</div></div><button class="x" onclick="del('ar',${a.i})">×</button></div>`).join('')||'<p class="m">Noch keine Arbeiten eingetragen.</p>'}</div>`};
V.gr=()=>{const g={};S.gr.forEach(x=>{(g[x.s]=g[x.s]||[]).push(x)});const av=Object.keys(g).sort().map(s=>({s,a:g[s].reduce((u,x)=>u+gv(x.n)*x.w,0)/g[s].reduce((u,x)=>u+x.w,0)})),
all=av.length?av.reduce((u,x)=>u+x.a,0)/av.length:0,gc=a=>a<=2.5?'var(--ok)':a<=3.5?'var(--w)':'var(--no)';
return `<div class="card"><h2>Notendurchschnitt</h2><div class="big" style="color:${av.length?gc(all):'inherit'}">${av.length?nf(all):'–'}</div><p class="m">Durchschnitt aus allen Fächern</p>
${av.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(x.s)}</span><b>${nf(x.a)}</b></div><div class="bar"><i style="width:${(6-x.a)/5*100}%;background:${gc(x.a)}"></i></div></div>`).join('')}</div>
<div class="card"><h2>Note eintragen</h2><div class="row"><select id="gs">${opts(S.subj)}</select><select id="ga">${opts(['Klassenarbeit','Test','Mündlich','Sonstiges'])}</select><select id="gn">${opts(GR,'2')}</select><input id="gw" type="number" min="0.5" step="0.5" value="1" style="width:70px" title="Gewichtung"><button class="btn" onclick="S.gr.push({i:Date.now(),s:$('#gs').value,a:$('#ga').value,n:$('#gn').value,w:+$('#gw').value||1});save();R()">+</button></div><p class="m">Zahl rechts = Gewichtung (z. B. Klassenarbeit 2).</p>
${S.gr.slice().reverse().map(x=>`<div class="it"><div><b>${esc(x.s)}</b> · ${esc(x.a)}<div class="m">Gewichtung ${x.w}</div></div><b>${x.n}</b><button class="x" onclick="del('gr',${x.i})">×</button></div>`).join('')}</div>`};
V.sum=()=>{const m=add(mon(T()),sumOff*7),w=wk(m),dp=[0,1,2,3,4,5,6].map(i=>{let a=0,b=0;w.g.forEach(r=>{if(r.v[i]!==null){b++;a+=r.v[i]}});return b?Math.round(a/b*100):null}),C=2*Math.PI*52,
h=[5,4,3,2,1,0].map(k=>wk(add(mon(T()),-7*k)).p);
return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><button class="chip" onclick="sumOff--;R()">‹</button><b>Woche ${wt(m)} · ${fm(m)} – ${fm(add(m,6))}</b><button class="chip" onclick="sumOff++;R()">›</button></div>
<p class="m" style="text-align:center">${sumOff==0?(di(T())==6?'Wochenabschluss':'Zwischenstand – Abschluss am Sonntag'):'Rückblick'}</p>
<div style="text-align:center"><svg width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--l)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${pc(w.p)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${w.p/100*C} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">${w.p} %</text></svg></div></div>
<div class="card"><h2>Pro Tag</h2><div class="cols">${dp.map((p,i)=>`<div><i style="height:${p===null?2:Math.max(2,p*.65)}px;background:${p===null?'var(--l)':pc(p)}"></i>${D[i].slice(0,2)}</div>`).join('')}</div></div>
<div class="card"><h2>Kriterien</h2><p class="m">Tippe auf ein Feld, um nachträglich abzuhaken.</p><table>${w.g.map(r=>{const k=r.v.filter(x=>x!==null);const p=k.length?Math.round(k.filter(Boolean).length/k.length*100):0;const one=r.c.d.length==1;return `<tr><td>${esc(r.c.n)}${one?` <span class="m">(nur ${D[r.c.d[0]].slice(0,2)})</span>`:''}</td>${r.v.map((v,i)=>v===null?(one?'<td></td>':'<td class="m">–</td>'):`<td><span class="hm" onclick="tg('${add(m,i)}','${r.c.id}',${!v})" style="background:${v?'var(--ok)':'var(--no)'};color:#fff">${v?'✓':'✗'}</span></td>`).join('')}${one?'<td></td>':`<td><b>${p}%</b></td>`}</tr>`}).join('')}<tr><td></td>${D.map(x=>`<th>${x.slice(0,2)}</th>`).join('')}<td></td></tr></table></div>
<div class="card"><h2>Letzte 6 Wochen</h2><div class="cols">${h.map(p=>`<div><i style="height:${Math.max(2,p*.65)}px;background:${pc(p)}"></i>${p}%</div>`).join('')}</div></div>`};
const sv=(k,v)=>{S[k]=v;save()},cd=(id,i)=>{const c=S.crit.find(x=>x.id==id);c.d=c.d.includes(i)?c.d.filter(x=>x!=i):[...c.d,i];save();R()};
V.set=()=>`<div class="card"><h2>Welche Woche ist gerade?</h2><div class="row">${['A','B'].map(x=>`<button class="chip ${wt(T())==x?'on':''}" onclick="S.anc=mon(T());S.ancT='${x}';save();R()">Diese Woche ist ${x}</button>`).join('')}</div><p class="m">Danach wechseln A und B automatisch jede Woche.</p></div>
<div class="card"><h2>Fächer (mit Komma getrennt)</h2><input style="width:100%" value="${esc(S.subj.join(', '))}" onchange="sv('subj',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div>
<div class="card"><h2>Tägliche Kriterien</h2>${S.crit.map(c=>`<div class="it" style="flex-wrap:wrap"><input style="flex:1;min-width:180px" value="${esc(c.n)}" onchange="S.crit.find(x=>x.id=='${c.id}').n=this.value;save()"><button class="x" onclick="if(confirm('Kriterium löschen?')){S.crit=S.crit.filter(x=>x.id!='${c.id}');save();R()}">×</button><div class="row" style="width:100%;margin:0">${D.map((x,i)=>`<button class="chip ${c.d.includes(i)?'on':''}" style="padding:3px 9px" onclick="cd('${c.id}',${i})">${x.slice(0,2)}</button>`).join('')}</div></div>`).join('')}
<button class="btn" style="margin-top:10px" onclick="S.crit.push({id:'c'+Date.now(),n:'Neues Kriterium',d:[0,1,2,3,4,5,6]});save();R()">+ Kriterium</button></div>
<div class="card"><h2>Sicherung (ohne Konto)</h2><p class="m">Alle Daten liegen nur in diesem Browser. Mit der Sicherungsdatei kannst du sie speichern oder auf ein anderes Gerät übertragen.</p><div class="row"><button class="btn" onclick="ex()">Exportieren</button><label class="btn">Importieren<input type="file" accept=".json" hidden onchange="im(this)"></label><button class="chip" onclick="if(confirm('Wirklich ALLE Daten löschen?')){localStorage.removeItem(K);location.reload()}">Alles löschen</button></div></div>`;
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tagesplaner-sicherung-'+T()+'.json';a.click()}
function im(f){const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();R();alert('Importiert')}catch(e){alert('Datei nicht lesbar')}};r.readAsText(f.files[0])}
R();
</script></body></html>
